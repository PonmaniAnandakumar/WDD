<!DOCTYPE html>
<html>
<head>
    <title>College Student Registration Form</title>
</head>

<body bgcolor="#EAF6FF">

<center>
<h1 style="color:darkblue;">🎓 College Student Registration Form</h1>
</center>

<form>

<fieldset style="background-color:#FFF8DC;">
<legend><b style="color:blue;">Personal Information</b></legend>

<label>Full Name:</label>
<input type="text" name="fullname"><br><br>

<label>Email:</label>
<input type="email" name="email"><br><br>

<label>Mobile Number:</label>
<input type="tel" name="mobile"><br><br>

<label>Password:</label>
<input type="password" name="password"><br><br>

<label>Confirm Password:</label>
<input type="password" name="confirm_password"><br><br>

<label>Date of Birth:</label>
<input type="date" name="dob"><br><br>

<label>Gender:</label>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
<br><br>

<label>Address:</label><br>
<textarea rows="4" cols="40"></textarea>

</fieldset>

<br>

<fieldset style="background-color:#F0FFF0;">
<legend><b style="color:green;">Course Details</b></legend>

<label>Department:</label>
<select>
    <option>Select Department</option>
    <option>Computer Science</option>
    <option>Information Technology</option>
    <option>Artificial Intelligence</option>
    <option>Data Science</option>
    <option>Cyber Security</option>
</select>

<br><br>

<label>Programming Languages Known:</label><br>

<input type="checkbox"> C
<input type="checkbox"> C++
<input type="checkbox"> Java
<input type="checkbox"> Python
<input type="checkbox"> JavaScript

<br><br>

<label>Upload Photo:</label>
<input type="file">

<br><br>

<label>Comments:</label><br>
<textarea rows="3" cols="40"></textarea>

</fieldset>

<br>

<center>
<input type="submit" value="Register">
<input type="reset" value="Clear Form">
<input type="button" value="Preview">
</center>

</form>

</body>
</html>
