<html>
<head>
<title>Task Deletion Confirmation & Feedback</title>
<script>
    function deleteTask() {

    alert("You are about to delete the task.");

            var result = confirm("Are you sure you want to delete this task?");

            if(result == true)
            {
                var reason = prompt("Enter the reason for deleting the task:");

                alert("Task Deleted Successfully!\nReason: " + reason);
            }
            else
            {
                alert("Task Deletion Cancelled.");
            }
        }
</script>

</head>

<body bgcolor="lightblue">

<center>

<h2>Task Deletion Confirmation & Feedback</h2>

<p>Click the button below to delete a task.</p>

<input type="button" value="Delete Task" onclick="deleteTask()">

</center>

</body>
</html>
