<!DOCTYPE html>
<html>
<head>
    <title>Create Invitation</title>
</head>

<body bgcolor="lightyellow">

<center>

<h1><font color="darkred">Create Wedding Invitation</font></h1>

<hr width="60%">

<form>

<table border="1" cellpadding="10" bgcolor="white">

<tr>
    <td>Bride Name</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Groom Name</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Wedding Date</td>
    <td><input type="date"></td>
</tr>

<tr>
    <td>Wedding Time</td>
    <td><input type="time"></td>
</tr>

<tr>
    <td>Venue</td>
    <td><textarea rows="3" cols="20"></textarea></td>
</tr>

<tr>
    <td>Template</td>
    <td>
        <select>
            <option>Traditional</option>
            <option>Royal</option>
            <option>Floral</option>
            <option>Modern</option>
        </select>
    </td>
</tr>

<tr>
    <td>Photo</td>
    <td><input type="file"></td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Create">
        <input type="reset" value="Clear">
    </td>
</tr>

</table>

</form>

<br>

<h3>Sample Invitation</h3>

<table border="2" cellpadding="15" bgcolor="mistyrose">

<tr>
<td align="center">

<h2>💍 Wedding Invitation 💍</h2>

<p><b>Bride Name</b> ❤️ <b>Groom Name</b></p>

<p>
Together with our families,<br>
we invite you to our wedding ceremony.
</p>

<p><b>Date:</b> DD/MM/YYYY</p>

<p><b>Time:</b> 10:30 AM</p>

<p><b>Venue:</b> Your Venue</p>

</td>
</tr>

</table>

</center>

</body>
</html>
